spring.application.name=cloudstorage
# Server Configuration
server.port=8080

# Use environment variables for sensitive data
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_storage}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# AWS S3 Credentials from environment variables
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_KEY}
aws.s3.bucketName=${AWS_S3_BUCKET_NAME}
aws.region=${AWS_REGION:us-west-2}

# Security Configuration from environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000 # 1 hour expiration